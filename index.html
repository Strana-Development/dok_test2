<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Памятка по документам банков</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1b2236;--muted:#6b7590;--line:#e3e8f2;--accent:#4f6df5;--accent2:#8b5cf6;--soft:#eef1ff;--shadow:0 10px 30px rgba(35,50,100,.08);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#10131c;--card:#181d2b;--ink:#eaedf7;--muted:#9aa3bb;--line:#273049;--accent:#7b93ff;--accent2:#a78bfa;--soft:#212a45;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 10% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent),radial-gradient(800px 400px at 100% 0,color-mix(in srgb,var(--accent2) 16%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:36px 18px 56px}
.hero{text-align:center;margin:10px 0 26px}
.hero .emoji{font-size:44px;line-height:1}
h1{font-size:clamp(28px,5vw,42px);line-height:1.15;margin:10px 0 8px;letter-spacing:-.03em}
.sub{color:var(--muted);margin:0 auto;max-width:520px}
.searchbox{position:relative;max-width:560px;margin:0 auto 24px}
.searchbox input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 18px 15px 48px;box-shadow:var(--shadow);outline:none}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.searchbox span{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.7}
.count{text-align:center;color:var(--muted);font-size:13px;margin:-10px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.bank{display:flex;align-items:center;gap:14px;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.bank:hover,.bank:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
.avatar{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.bname{font-weight:700;line-height:1.25}
.bnote{font-size:12.5px;color:var(--muted);margin-top:2px}
.arrow{margin-left:auto;color:var(--muted);font-size:20px}
.none{text-align:center;color:var(--muted);padding:40px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{font:inherit;font-weight:650;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
.actions{display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;gap:16px;padding:22px 24px;border-bottom:1px solid var(--line)}
.card-head .avatar{width:56px;height:56px;font-size:22px;border-radius:16px}
.card-head h2{margin:0;font-size:clamp(22px,4vw,28px);line-height:1.2}
.card-head p{margin:3px 0 0;color:var(--muted);font-size:14px}
.body{padding:22px 24px 26px}
.sec{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:22px 0 8px}
.sec:first-child{margin-top:0}
.line{margin:6px 0;overflow-wrap:anywhere}
.item{display:flex;gap:12px;margin:8px 0;overflow-wrap:anywhere}
.item i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-style:normal;font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:1px}
.line.note{background:var(--soft);border-radius:12px;padding:10px 14px}
.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
[hidden]{display:none!important}
@media(max-width:560px){.wrap{padding:22px 12px 40px}.card-head,.body{padding:18px}.actions .btn{padding:10px 13px}}
@media print{body{background:#fff;color:#000}.topbar,.footer{display:none!important}.card{box-shadow:none;border:0}.avatar{display:none}}
</style>
</head>
<body>
<main class="wrap">
<section id="home">
<header class="hero">
<div class="emoji">🏦</div>
<h1>Документы по банкам</h1>
<p class="sub">Выберите банк — и сразу увидите, какие документы нужны для сделки.</p>
</header>
<div class="searchbox"><span>🔎</span><input id="search" type="search" placeholder="Найти банк…" autocomplete="off" aria-label="Найти банк"></div>
<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<div class="none" id="none" hidden>Такого банка не нашлось 🤔<br>Попробуйте изменить запрос</div>
</section>
<section id="detail" hidden>
<div class="topbar">
<button class="btn" id="back" type="button">← Все банки</button>
<div class="actions"><button class="btn" id="copy" type="button">Копировать</button><button class="btn primary" id="print" type="button">Печать</button></div>
</div>
<article class="card">
<div class="card-head"><div class="avatar" id="dAvatar"></div><div><h2 id="dTitle"></h2><p id="dSub"></p></div></div>
<div class="body" id="dBody"></div>
</article>
</section>
<div class="footer">Перед сделкой сверяйте актуальность требований с банком</div>
</main>

const $ = id => document.getElementById(id);
const norm = s => s.toLocaleLowerCase('ru').replace(/ё/g,'е');
const split = n => { const m = n.match(/^(.*?)\s*\((.*)\)$/); return m ? [m[1], m[2]] : [n, '']; };
const hue = i => (i * 47 + 220) % 360;
const initials = n => { const c = n.replace(/[^A-Za-zА-Яа-яЁё]/g,''); return (c[0] || '?').toUpperCase(); };
function paint(el, i, name){ el.textContent = initials(name); el.style.background = `linear-gradient(135deg,hsl(${hue(i)} 70% 55%),hsl(${hue(i)+40} 70% 48%))`; }

function renderGrid(){
 const q = norm($('search').value.trim());
 const grid = $('grid'); grid.textContent = '';
 let n = 0;
 banks.forEach((b, i) => {
  if (q && !norm(b.name).includes(q)) return;
  n++;
  const [main, note] = split(b.name);
  const btn = document.createElement('button');
  btn.className = 'bank'; btn.type = 'button';
  const av = document.createElement('div'); av.className = 'avatar'; paint(av, i, main);
  const tx = document.createElement('div');
  const nm = document.createElement('div'); nm.className = 'bname'; nm.textContent = main; tx.appendChild(nm);
  if (note){ const nt = document.createElement('div'); nt.className = 'bnote'; nt.textContent = note; tx.appendChild(nt); }
  const ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '›';
  btn.append(av, tx, ar);
  btn.addEventListener('click', () => { location.hash = '#/bank/' + i; });
  grid.appendChild(btn);
 });
 $('none').hidden = n > 0;
 $('count').textContent = q ? 'Найдено: ' + n : 'Всего банков: ' + banks.length;
}

function renderDetail(i){
 const b = banks[i]; const [main, note] = split(b.name);
 paint($('dAvatar'), i, main);
 $('dTitle').textContent = main;
 $('dSub').textContent = note || 'Список необходимых документов';
 const body = $('dBody'); body.textContent = '';
 b.docs.split('\n').forEach(l => {
  const t = l.trim(); if (!t) return;
  let el;
  const num = t.match(/^(\d+)\.\s*(.*)$/);
  if (/^[^а-яё]*[А-ЯЁ][А-ЯЁ\s]+:$/.test(t) || (t.endsWith(':') && t.length < 70 && !num)){
   el = document.createElement('div'); el.className = 'sec'; el.textContent = t.slice(0, -1);
  } else if (num){
   el = document.createElement('div'); el.className = 'item';
   const i2 = document.createElement('i'); i2.textContent = num[1];
   const s = document.createElement('span'); s.textContent = num[2];
   el.append(i2, s);
  } else {
   el = document.createElement('div'); el.className = 'line';
   if (/^(Срок действия|Учитываются|Справка предоставляется|Разведённые|Уточните|Эти документы)/.test(t)) el.classList.add('note');
   el.textContent = t;
  }
  body.appendChild(el);
 });
 document.title = main + ' — документы';
}

function route(){
 const m = location.hash.match(/^#\/bank\/(\d+)$/);
 const i = m ? Number(m[1]) : -1;
 if (i >= 0 && i < banks.length){
  renderDetail(i); $('home').hidden = true; $('detail').hidden = false;
 } else {
  $('detail').hidden = true; $('home').hidden = false; document.title = 'Памятка по документам банков';
 }
 window.scrollTo(0, 0);
}

$('search').addEventListener('input', renderGrid);
$('search').addEventListener('keydown', e => { if (e.key === 'Enter'){ const f = $('grid').querySelector('button'); if (f) f.click(); } });
$('back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.hash = ''; });
$('print').addEventListener('click', () => window.print());
$('copy').addEventListener('click', async () => {
 const text = $('dTitle').textContent + ($('dSub').textContent && banks.find(b => b.name.startsWith($('dTitle').textContent)) ? '' : '') + '\n\n' + banks.find(b => split(b.name)[0] === $('dTitle').textContent).docs;
 const btn = $('copy');
 try { await navigator.clipboard.writeText(text); }
 catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
 btn.textContent = 'Скопировано ✓'; setTimeout(() => btn.textContent = 'Копировать', 1600);
});
window.addEventListener('hashchange', route);
renderGrid(); route();
</script>
